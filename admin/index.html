<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Administrador HSM (demostración)</title>
<style>
:root{--r:#c20e1a;--ro:#88020b;--n:#1d1d1f;--g:#f4f4f5;--b:#e2e2e5}*{box-sizing:border-box}body{margin:0;font:16px/1.5 "Roboto Flex",Roboto,Arial,sans-serif;color:#222;background:var(--g)}
.prov{background:#111;color:#fff;text-align:center;font-weight:700;font-size:13px;text-transform:uppercase;padding:7px;border-bottom:3px solid var(--r);letter-spacing:.04em}
.login{max-width:380px;margin:9vh auto;background:#fff;border:1px solid var(--b);border-radius:14px;padding:28px;box-shadow:0 6px 24px rgba(0,0,0,.08)}.login h1{margin:0 0 4px;color:var(--r);font-size:1.6rem}
.login input{width:100%;padding:12px;border:1px solid #c9c9ce;border-radius:8px;font:inherit;margin:10px 0}.btn{background:var(--r);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:var(--ro)}.btn.l{background:#fff;color:var(--r);border:1.5px solid var(--r)}.btn.l:hover{background:#fdecee}
.err{color:#b00020;font-weight:700;min-height:1.4em}.cab{background:var(--r);color:#fff;display:flex;gap:16px;align-items:center;padding:12px 20px;flex-wrap:wrap}.cab b{font-size:1.2rem}.cab small{opacity:.9}.cab .sp{flex:1}
.cab a,.cab button{color:#fff}.cab button{background:transparent;border:1.5px solid #fff;border-radius:8px;padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--b);padding:0 14px;flex-wrap:wrap}nav.tabs button{background:none;border:0;border-bottom:4px solid transparent;padding:12px 16px;font:inherit;font-weight:700;color:#555;cursor:pointer}nav.tabs button.on{color:var(--r);border-color:var(--r)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}.aviso{background:#fff8e1;border:1px solid #f0d27a;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.93rem}
.tarj{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}.k{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px}.k b{display:block;font-size:2rem;color:var(--r);line-height:1}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b);border-radius:12px;overflow:hidden}th,td{padding:9px 12px;border-bottom:1px solid var(--b);text-align:left;font-size:.93rem;vertical-align:middle}th{background:var(--n);color:#fff}
td input[type=text]{width:100%;padding:7px 9px;border:1px solid #c9c9ce;border-radius:6px;font:inherit}tr.mod td{background:#fff8e1}tr.off td{opacity:.55}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;align-items:center}.bar input[type=search]{flex:1;min-width:220px;padding:10px 12px;border:1px solid #c9c9ce;border-radius:8px;font:inherit}
.f{display:grid;grid-template-columns:200px 1fr;gap:8px 14px;background:#fff;border:1px solid var(--b);border-radius:12px;padding:18px}.f label{font-weight:700}.f input{padding:9px;border:1px solid #c9c9ce;border-radius:6px;font:inherit}
@media(max-width:700px){.f{grid-template-columns:1fr}}
</style></head><body><div class="prov">Administrador de demostración · versión de pruebas, no es el sitio oficial</div>
<div id="v-login" class="login"><h1>Administrador HSM</h1><div id="tv" style="color:#666;margin-bottom:8px">Versión 4 · línea gráfica original + diagramación V1</div><p>Ingresa la clave de administrador para continuar.</p><form id="f-login"><label for="clave" style="font-weight:700">Clave</label><input id="clave" type="password" autocomplete="current-password" required autofocus><div class="err" id="err" role="alert"></div><button class="btn" type="submit">Ingresar</button></form></div>
<div id="v-app" hidden><div class="cab"><b>HSM · Administrador</b><small id="tv2"></small><span class="sp"></span><a id="ver-sitio" href="../">Ver sitio</a><button id="salir" type="button">Salir</button></div>
<nav class="tabs" id="tabs"></nav><main id="m"></main></div>
<script>
(function(){"use strict";
var HUELLA="5ba81df5c4ad13eadb08e8e602981f16b0d6178f2e653af20c7b8413e7e50a40",SAL="hsm-admin-demo:",CK="hsm_admin_demo_V4",LS="hsm_admin_cambios_V4",D=null,E={p:{},a:{}},T="resumen";
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function cargarCambios(){try{E=JSON.parse(localStorage.getItem(LS)||"")||E}catch(x){}E.p=E.p||{};E.a=E.a||{}}
function guardarCambios(){try{localStorage.setItem(LS,JSON.stringify(E))}catch(x){}}
function entrar(){$("#v-login").hidden=true;$("#v-app").hidden=false;fetch("datos.json").then(function(r){return r.json()}).then(function(d){D=d;$("#tv2").textContent=d.titulo;cargarCambios();menu();ver()}).catch(function(){$("#m").innerHTML='<p class="err">No se pudieron leer los datos del sitio.</p>'})}
$("#f-login").addEventListener("submit",function(e){e.preventDefault();sha(SAL+$("#clave").value).then(function(h){if(h===HUELLA){try{sessionStorage.setItem(CK,"1")}catch(x){}entrar()}else{$("#err").textContent="Clave incorrecta."}})});
$("#salir").addEventListener("click",function(){try{sessionStorage.removeItem(CK)}catch(x){}location.reload()});
function menu(){var t=[["resumen","Resumen"],["productos","Productos"],["noticias","Noticias"],["banners","Banners"],["ajustes","Ajustes"],["mensajes","Mensajes"],["ayuda","Ayuda"]];$("#tabs").innerHTML=t.map(function(x){return'<button type="button" data-t="'+x[0]+'"'+(T===x[0]?' class="on"':"")+">"+x[1]+"</button>"}).join("");$("#tabs").onclick=function(e){var b=e.target.closest("button");if(b){T=b.getAttribute("data-t");menu();ver()}}}
function nCambios(){return Object.keys(E.p).length+Object.keys(E.a).length}
var AV='<div class="aviso"><strong>Demostración.</strong> Esta pantalla muestra los datos reales del sitio y deja probar cambios, pero <strong>los cambios se guardan solo en este navegador</strong> y no modifican el sitio publicado. El administrador real (usuarios, historial y publicación) vive en el servidor.</div>';
function ver(){var m=$("#m");if(T==="resumen"){var vis=D.productos.filter(function(p){return(E.p[p.id]&&E.p[p.id].visible!==undefined?E.p[p.id].visible:p.visible)}).length;m.innerHTML=AV+'<div class="tarj"><div class="k"><b>'+D.productos.length+'</b>productos ('+vis+' visibles)</div><div class="k"><b>'+D.noticias.length+'</b>noticias</div><div class="k"><b>'+D.banners.length+'</b>banners</div><div class="k"><b>'+nCambios()+'</b>cambios de prueba</div></div><p>Usa las pestañas para revisar y editar. Con <em>Descargar cambios</em> obtienes un archivo con lo que modificaste, útil para pasarlo a quien actualiza el servidor.</p><p><button class="btn l" id="dl" type="button">Descargar cambios (JSON)</button> <button class="btn l" id="rs" type="button">Descartar cambios de prueba</button></p>';$("#dl").onclick=function(){var b=new Blob([JSON.stringify({version:D.version,cambios:E},null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cambios_hsm_"+D.version+".json";a.click()};$("#rs").onclick=function(){if(confirm("¿Descartar los cambios de prueba?")){E={p:{},a:{}};guardarCambios();ver()}}}
else if(T==="productos"){m.innerHTML=AV+'<div class="bar"><input type="search" id="q" placeholder="Buscar por nombre, SKU o familia…" aria-label="Buscar"><span id="cn"></span></div><div style="overflow-x:auto"><table><thead><tr><th>Nombre</th><th>SKU</th><th>Familia</th><th>Visible</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>';var pintar=function(){var q=($("#q").value||"").toLowerCase(),n=0;$("#tb").innerHTML=D.productos.filter(function(p){return!q||(p.nombre+" "+p.sku+" "+p.familia).toLowerCase().indexOf(q)>-1}).map(function(p){var c=E.p[p.id]||{},nom=c.nombre!==undefined?c.nombre:p.nombre,vis=c.visible!==undefined?c.visible:p.visible;n++;return'<tr class="'+(c.nombre!==undefined||c.visible!==undefined?"mod ":"")+(vis?"":"off")+'"><td><input type="text" data-id="'+p.id+'" value="'+esc(nom)+'" aria-label="Nombre"></td><td>'+esc(p.sku)+"</td><td>"+esc(p.familia)+'</td><td><input type="checkbox" data-v="'+p.id+'"'+(vis?" checked":"")+' aria-label="Visible"></td><td><a href="../'+esc(p.url)+'" target="_blank" rel="noopener">Ver</a></td></tr>'}).join("");$("#cn").textContent=n+" productos"};pintar();$("#q").oninput=pintar;$("#tb").onchange=function(e){var t=e.target,id=t.getAttribute("data-id")||t.getAttribute("data-v"),p=D.productos.filter(function(x){return String(x.id)===id})[0];E.p[id]=E.p[id]||{};if(t.hasAttribute("data-id")){E.p[id].nombre=t.value}else{E.p[id].visible=t.checked}guardarCambios();pintar();menu()}}
else if(T==="noticias"){m.innerHTML=AV+'<table><thead><tr><th>Fecha</th><th>Título</th><th></th></tr></thead><tbody>'+(D.noticias.map(function(n){return"<tr><td>"+esc(n.fecha)+"</td><td>"+esc(n.titulo)+'</td><td><a href="../'+esc(n.url)+'" target="_blank" rel="noopener">Ver</a></td></tr>'}).join("")||'<tr><td colspan="3">Sin noticias.</td></tr>')+"</tbody></table>"}
else if(T==="banners"){m.innerHTML=AV+(D.banners.length?'<table><thead><tr><th>Banner</th><th>Activo</th></tr></thead><tbody>'+D.banners.map(function(b){return"<tr><td>"+esc(b.titulo)+"</td><td>"+(b.activo?"Sí":"No")+"</td></tr>"}).join("")+"</tbody></table>":"<p>Esta versión no usa banners administrables.</p>")}
else if(T==="ajustes"){m.innerHTML=AV+'<div class="f">'+Object.keys(D.ajustes).map(function(k){var v=E.a[k]!==undefined?E.a[k]:D.ajustes[k];return'<label for="a-'+k+'">'+esc(k)+'</label><input id="a-'+k+'" data-k="'+k+'" value="'+esc(v)+'">'}).join("")+"</div>";m.oninput=function(e){var k=e.target.getAttribute("data-k");if(k){E.a[k]=e.target.value;guardarCambios();menu()}}}
else if(T==="mensajes"){m.innerHTML=AV+'<div class="k"><h3 style="margin-top:0">Mensajes de clientes</h3><p>Cuando el sitio corre en el servidor, los formularios (contacto, cotización, arriendo, asesoría Ley 21.719 y el asistente) guardan aquí cada solicitud con su origen y campaña de Google Ads, y avisan por correo. En esta versión de demostración, los formularios abren el correo del visitante, por eso no hay mensajes que mostrar.</p></div>'}
else{m.innerHTML=AV+'<div class="k"><h3 style="margin-top:0">Cómo se usa</h3><ol><li><strong>Productos:</strong> cambia el nombre o deja de mostrar un producto.</li><li><strong>Ajustes:</strong> teléfono, correo, horario y códigos de medición.</li><li><strong>Descargar cambios:</strong> guarda en un archivo lo que probaste.</li><li>El administrador real se publica con el sitio en el servidor de la empresa.</li></ol></div>'}}
if(!window.crypto||!crypto.subtle){$("#err").textContent="Este navegador no permite verificar la clave (se necesita https)."}
try{if(sessionStorage.getItem(CK)==="1"){entrar()}}catch(x){}
})();
</script></body></html>
